name: 产品设计雷达 Daily Digest

on:
  schedule:
    - cron: "30 21 * * *"   # 北京时间 05:30（UTC 21:30 前一天）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: channels/product-radar/requirements.txt

      - name: 安装依赖
        run: pip install -r channels/product-radar/requirements.txt

      - name: 运行产品设计雷达 digest
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT:   ${{ secrets.DIGEST_RECIPIENT }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY:       ${{ secrets.QWEN_API_KEY }}
          CHANNEL_NAME:       digest-hub/product-radar
        run: python channels/product-radar/main.py

      - name: 提交 usage 日志
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usage/*.jsonl data/model-scores/*.jsonl 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: log AI usage [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          exit 1
